name: Build desktop executables

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - test

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bun install --frozen-lockfile
      - run: python -m pip install playwright==1.58.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/run_browser_tests.py --browser chromium --artifacts-dir "${{ runner.temp }}/dukou-browser-artifacts"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: ${{ runner.temp }}/dukou-browser-artifacts
          if-no-files-found: ignore

  build:
    needs: [test, browser]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            script: compile:windows-x64
            artifact: dukou-windows-x64
            path: dist/dukou-windows-x64.exe
          - runner: macos-15
            script: compile:macos-arm64
            artifact: dukou-macos-arm64
            path: dist/dukou-macos-arm64
          - runner: macos-15-intel
            script: compile:macos-x64
            artifact: dukou-macos-x64
            path: dist/dukou-macos-x64
          - runner: ubuntu-latest
            script: compile:linux-x64
            artifact: dukou-linux-x64
            path: dist/dukou-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}
      - run: bun run smoke:binary ${{ matrix.path }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

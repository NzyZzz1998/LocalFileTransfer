name: Build desktop executables

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - "dev/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            script: compile:windows-x64
            artifact: dukou-windows-x64
            path: dist/dukou-windows-x64.exe
          - runner: macos-15
            script: compile:macos-arm64
            artifact: dukou-macos-arm64
            path: dist/dukou-macos-arm64
          - runner: macos-15-intel
            script: compile:macos-x64
            artifact: dukou-macos-x64
            path: dist/dukou-macos-x64
          - runner: ubuntu-latest
            script: compile:linux-x64
            artifact: dukou-linux-x64
            path: dist/dukou-linux-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
